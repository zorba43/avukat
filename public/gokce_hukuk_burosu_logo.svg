<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fbfaf6"/>
  <g transform="translate(600 455)">
    <!-- circular G -->
    <path d="M 0,-230 A 230,230 0 1 0 0,230 A 230,230 0 0 0 150,175" fill="none" stroke="#0b2a4a" stroke-width="24" stroke-linecap="round"/>
    <!-- H -->
    <path d="M -105,-165 L -105,170 M 105,-165 L 105,170 M -105,0 L 105,0" fill="none" stroke="#0b2a4a" stroke-width="28" stroke-linecap="square"/>
    <!-- central pillar / I -->
    <path d="M -30,-185 L 30,-185 L 20,-165 L 20,175 L 55,190 L 55,210 L -55,210 L -55,190 L -20,175 L -20,-165 Z" fill="#c6a24a"/>
    <!-- scale beam -->
    <path d="M -205,-75 Q 0,-150 205,-75" fill="none" stroke="#c6a24a" stroke-width="18" stroke-linecap="round"/>
    <circle cx="-205" cy="-75" r="10" fill="#c6a24a"/>
    <circle cx="205" cy="-75" r="10" fill="#c6a24a"/>
    <!-- left scale -->
    <path d="M -205,-65 L -265,55 M -205,-65 L -145,55" fill="none" stroke="#c6a24a" stroke-width="10"/>
    <path d="M -285,55 Q -205,105 -125,55 Z" fill="#c6a24a"/>
    <!-- right scale -->
    <path d="M 205,-65 L 145,55 M 205,-65 L 265,55" fill="none" stroke="#c6a24a" stroke-width="10"/>
    <path d="M 125,55 Q 205,105 285,55 Z" fill="#c6a24a"/>
    <!-- base -->
    <path d="M -65,210 L 65,210 L 85,230 L 85,245 L -85,245 L -85,230 Z" fill="#c6a24a"/>
  </g>
  <text x="600" y="800" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-weight="600" fill="#0b2a4a">Gökçe Hukuk Bürosu</text>
  <g stroke="#c6a24a" stroke-width="6">
    <line x1="210" y1="875" x2="520" y2="875"/>
    <line x1="680" y1="875" x2="990" y2="875"/>
  </g>
  <g transform="translate(600 875)" fill="#c6a24a">
    <rect x="-22" y="-28" width="44" height="12" rx="2"/>
    <rect x="-28" y="-14" width="56" height="9" rx="2"/>
    <rect x="-18" y="-5" width="36" height="34"/>
    <rect x="-30" y="29" width="60" height="9" rx="2"/>
  </g>
</svg>
